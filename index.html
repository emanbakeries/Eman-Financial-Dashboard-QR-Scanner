<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Eman QR</title>
    <meta name="description" content="Mobile-first PWA for Eman Bakeries to scan Saudi ZATCA invoice QR codes and securely transmit payloads to external APIs." />
    <meta property="og:title" content="Eman QR" />
    <meta property="og:description" content="Mobile-first PWA for Eman Bakeries to scan Saudi ZATCA invoice QR codes and securely transmit payloads to external APIs." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eman QR" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <script>
      // Gracefully prevent harmless Vite WebSocket connection errors in sandbox iframes
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason.message).includes('WebSocket'))) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-sky-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
