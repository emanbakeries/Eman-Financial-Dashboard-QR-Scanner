<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background with safe area -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Scanner Frame -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-opacity="0.35" />

  <!-- Corner Brackets -->
  <path d="M 120 76 L 86 76 A 10 10 0 0 0 76 86 L 76 120" fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" />
  <path d="M 392 76 L 426 76 A 10 10 0 0 1 436 86 L 436 120" fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" />
  <path d="M 76 392 L 76 426 A 10 10 0 0 0 86 436 L 120 436" fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" />
  <path d="M 436 392 L 436 426 A 10 10 0 0 1 426 436 L 392 436" fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" />

  <!-- QR Finder Pattern Top-Left -->
  <rect x="130" y="130" width="84" height="84" rx="16" fill="none" stroke="#ffffff" stroke-width="12" />
  <rect x="152" y="152" width="40" height="40" rx="8" fill="#38bdf8" />

  <!-- QR Finder Pattern Top-Right -->
  <rect x="298" y="130" width="84" height="84" rx="16" fill="none" stroke="#ffffff" stroke-width="12" />
  <rect x="320" y="152" width="40" height="40" rx="8" fill="#38bdf8" />

  <!-- QR Finder Pattern Bottom-Left -->
  <rect x="130" y="298" width="84" height="84" rx="16" fill="none" stroke="#ffffff" stroke-width="12" />
  <rect x="152" y="320" width="40" height="40" rx="8" fill="#38bdf8" />

  <!-- Center Accent: stylized invoice / grain symbol -->
  <circle cx="340" cy="340" r="28" fill="#38bdf8" />
  <rect x="238" y="156" width="36" height="18" rx="6" fill="#94a3b8" />
  <rect x="238" y="190" width="36" height="36" rx="8" fill="#ffffff" />
  <rect x="156" y="238" width="56" height="36" rx="8" fill="#94a3b8" />
  <rect x="238" y="250" width="36" height="56" rx="8" fill="#38bdf8" />
  <rect x="298" y="250" width="56" height="24" rx="6" fill="#ffffff" />
</svg>
